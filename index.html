<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="container py-5">
    <h2 class="text-center mb-4">Expense Tracker</h2>

    <!-- Income Input -->
    <div class="card p-3 mb-4">
      <h5>Enter Total Income:</h5>
      <div class="input-group mb-2">
        <input v-model.number="income" type="number" class="form-control" placeholder="Your income">
        <button class="btn btn-success" @click="saveIncome">Save</button>
      </div>
      <p class="mb-0">Income: ₹{{ income }}</p>
      <p class="text-danger mb-0">Total Expenses: ₹{{ totalExpenses }}</p>
      <h5 class="mt-2">Balance: ₹{{ balance }}</h5>
    </div>

    <!-- Add Expense -->
    <div class="input-group mb-3">
      <input v-model="text" type="text" class="form-control" placeholder="Expense description">
      <input v-model.number="amount" type="number" class="form-control" placeholder="Amount">
      <button class="btn btn-primary" @click="addExpense">Add Expense</button>
    </div>

    <!-- Expense List -->
    <ul class="list-group">
      <li v-for="(t, i) in expenses" :key="i"
          class="list-group-item d-flex justify-content-between align-items-center list-group-item-danger">
        {{ t.text }} - ₹{{ t.amount }}
        <button class="btn btn-sm btn-outline-danger" @click="deleteExpense(i)">x</button>
      </li>
    </ul>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="app.js"></script>
</body>
</html>
